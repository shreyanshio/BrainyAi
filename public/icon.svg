<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#27272A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Background -->
  <rect width="512" height="512" rx="112" fill="#09090B"/>
  <rect x="4" y="4" width="504" height="504" rx="108" stroke="url(#borderGrad)" stroke-width="4" fill="none"/>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#F59E0B" fill-opacity="0.08" filter="url(#goldGlow)" />

  <!-- Brainy 'B' Monogram / Neural Architecture -->
  <g filter="url(#goldGlow)">
    <!-- Vertical Spine -->
    <path d="M168 128H236C296 128 344 160 344 212C344 246 322 274 290 286C332 298 358 332 358 374C358 430 306 464 242 464H168C154.745 464 144 453.255 144 440V152C144 138.745 154.745 128 168 128Z" 
          fill="none" 
          stroke="url(#goldGradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Divider -->
    <path d="M160 288H264" 
          stroke="url(#goldGradient)" 
          stroke-width="28" 
          stroke-linecap="round"/>
    
    <!-- Inner Neural Nodes -->
    <circle cx="240" cy="208" r="12" fill="#FEF08A"/>
    <circle cx="254" cy="376" r="14" fill="#FEF08A"/>
    <circle cx="204" cy="208" r="6" fill="#F59E0B"/>
    <circle cx="208" cy="376" r="7" fill="#F59E0B"/>

    <!-- Neural Circuit Accent Lines -->
    <path d="M252 208L290 208" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
    <path d="M268 376L304 376" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 6"/>
  </g>
</svg>