# ============================================================================
# 3. TOOL TERMINOLOGY (Explicit or implicit tool triggers)
# ============================================================================
tools:
  web_search:
    triggers:
      - web search
      - search online
      - google it
      - look up
      - latest 2026
      - right now
      - fresh news
      - find online
    tool_name: web_search
    providers:
      - tavily
      - duckduckgo

  document_pdf:
    triggers:
      - in this pdf
      - uploaded file
      - document says
      - according to notes
      - from my book
    tool_name: pdf_retrieval
    providers:
      - pymupdf_local

  math_computation:
    triggers:
      - symbolic calculation
      - matrix inversion
      - evaluate integral
      - sympy
    tool_name: math_engine
    providers:
      - sympy_local

