# ============================================================================
# 2. ACTION TERMINOLOGY (What the user wants to do with the subject)
# ============================================================================
actions:
  explain:
    verbs:
      - explain
      - describe
      - clarify
      - teach
      - understand
      - samjhao
      - samjavo
